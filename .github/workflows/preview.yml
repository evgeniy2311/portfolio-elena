# Превью сайта для просмотра без установки: https://evgeniy2311.github.io/portfolio-elena/
# Обновляется само после каждого push в main.
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Та же обёртка, что и локально: убирает proxy.ts только на время export-сборки и возвращает его.
      # QA-флаг NEXT_PUBLIC_QA_FIXTURE здесь не задаётся никогда; сборка с ним завершается ошибкой.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /portfolio-elena
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
